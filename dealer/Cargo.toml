[package]
name = "dealer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.tonic]
version = "0.8.3"

[dependencies.prost]
version = "0.11.3"

[dependencies.prost-types]
version = "0.11.3"

[dependencies.tokio]
version = "1.23.0"
features = ["full"]

[dependencies.protobuf]
version = "3.2.0"

[dependencies.chrono]
version = "0.4"
features = ["serde"]

[dependencies.uuid]
version = "1.0"
features = ["serde", "v4"]

[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"]

[dependencies.async-trait]
version = "0.1.60"

[dependencies.home]
version = ">=0.5.4, <0.5.12"

[dependencies.tokio-util]
version = "0.7"

[build-dependencies]
tonic-build = {version = "0.8.4"}


[[bin]]
    name = "dealer"
    path = "src/main.rs"
