syntax = "proto3";

package v1;
option go_package = "github.com/XaviFP/toshokan/dealer/api/proto/v1";

service Dealer {
    rpc Deal (DealRequest) returns (DealResponse);
    rpc StoreAnswers (StoreAnswersRequest) returns (StoreAnswersResponse);
    // Like StoreAnswers, but only for cards already in the user's pool; never adds cards.
    rpc ReviewAnswers (ReviewAnswersRequest) returns (ReviewAnswersResponse);
}

message DealRequest {
    string user_id = 1;
    // Set at most one of deck_ids, course_id and lesson_id. None means all of the user's
    // answered cards, across every deck.
    repeated string deck_ids = 2;
    uint32 number_of_cards = 3;
    string course_id = 4;
    string lesson_id = 5;
}

message DealResponse {
    repeated string card_ids = 1;
}

message StoreAnswersRequest {
    string user_id = 1;
    repeated string answer_ids = 2;
}

message StoreAnswersResponse {}

message ReviewAnswersRequest {
    string user_id = 1;
    repeated string answer_ids = 2;
}

message ReviewAnswersResponse {}
